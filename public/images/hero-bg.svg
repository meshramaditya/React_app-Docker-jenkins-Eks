<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2F2FE4;stop-opacity:0.08" />
      <stop offset="50%" style="stop-color:#162E93;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#1A1953;stop-opacity:0.03" />
    </linearGradient>
    <radialGradient id="heroBlob1" cx="20%" cy="20%">
      <stop offset="0%" style="stop-color:#2F2FE4;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#2F2FE4;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="heroBlob2" cx="80%" cy="80%">
      <stop offset="0%" style="stop-color:#162E93;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#162E93;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1200" height="400" fill="url(#heroGradient)"/>
  
  <!-- Decorative blobs -->
  <circle cx="-100" cy="-100" r="400" fill="url(#heroBlob1)"/>
  <circle cx="1300" cy="500" r="350" fill="url(#heroBlob2)"/>
  
  <!-- Accent lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="#2F2FE4" stroke-width="1" opacity="0.1"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#162E93" stroke-width="1" opacity="0.1"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#2F2FE4" stroke-width="1" opacity="0.1"/>
  
  <!-- Decorative shapes -->
  <polygon points="100,50 150,80 100,110 50,80" fill="none" stroke="#2F2FE4" stroke-width="2" opacity="0.2"/>
  <polygon points="1100,320 1150,350 1100,380 1050,350" fill="none" stroke="#162E93" stroke-width="2" opacity="0.2"/>
  <circle cx="600" cy="200" r="80" fill="none" stroke="#2F2FE4" stroke-width="1" opacity="0.15"/>
</svg>