<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8faf9"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="devopsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2F2FE4;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#162E93;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#devopsGradient)"/>
  
  <!-- Docker-like containers -->
  <rect x="60" y="80" width="70" height="70" rx="8" fill="none" stroke="#2F2FE4" stroke-width="2"/>
  <rect x="155" y="80" width="70" height="70" rx="8" fill="none" stroke="#162E93" stroke-width="2"/>
  <rect x="250" y="80" width="70" height="70" rx="8" fill="none" stroke="#2F2FE4" stroke-width="2"/>
  
  <!-- Container fills with gradient -->
  <rect x="60" y="80" width="70" height="70" rx="8" fill="#2F2FE4" opacity="0.1"/>
  <rect x="155" y="80" width="70" height="70" rx="8" fill="#162E93" opacity="0.1"/>
  <rect x="250" y="80" width="70" height="70" rx="8" fill="#2F2FE4" opacity="0.1"/>
  
  <!-- Container indicators -->
  <circle cx="95" cy="120" r="4" fill="#2F2FE4"/>
  <circle cx="95" cy="130" r="4" fill="#2F2FE4"/>
  <circle cx="190" cy="120" r="4" fill="#162E93"/>
  <circle cx="190" cy="130" r="4" fill="#162E93"/>
  <circle cx="285" cy="120" r="4" fill="#2F2FE4"/>
  <circle cx="285" cy="130" r="4" fill="#2F2FE4"/>
  
  <!-- Connection lines -->
  <line x1="130" y1="120" x2="155" y2="120" stroke="#162E93" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="225" y1="120" x2="250" y2="120" stroke="#162E93" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Pipeline arrows -->
  <polygon points="145,115 140,120 145,125" fill="#162E93"/>
  <polygon points="240,115 235,120 240,125" fill="#162E93"/>
  
  <!-- Cloud/deployment symbol -->
  <path d="M 80 200 Q 60 200 55 185 Q 40 180 40 165 Q 40 150 55 145 Q 65 130 85 135 Q 100 120 120 140 Q 140 130 150 145 Q 165 140 170 160 Q 180 150 195 160 Q 200 145 220 150 Q 235 145 240 165 Q 255 155 270 170 Q 280 165 285 180 Q 300 175 300 190 Q 305 210 285 220 Q 270 230 250 225 Q 220 235 190 230 Q 160 240 130 235 Q 100 240 80 225 Z" fill="none" stroke="#2F2FE4" stroke-width="2" opacity="0.6"/>
  
  <!-- Label -->
  <text x="200" y="280" font-size="18" font-weight="700" text-anchor="middle" fill="#162E93">DevOps & Deployment</text>
</svg>